name: App main release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, scan, tag, and push images
    runs-on: ubuntu-latest
    environment: app-release-production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set SHA_SHORT
        run: echo "SHA_SHORT=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-app-ci-role

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --- Frontend ---
      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t logbeacon/frontend:${{ env.SHA_SHORT }} \
            frontend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon/frontend:${{ env.SHA_SHORT }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Tag and push frontend image
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/logbeacon/frontend:${{ env.SHA_SHORT }}"
          docker tag logbeacon/frontend:${{ env.SHA_SHORT }} "$IMAGE_URI"
          docker push "$IMAGE_URI"

      # --- Backend ---
      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t logbeacon/backend:${{ env.SHA_SHORT }} \
            backend

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon/backend:${{ env.SHA_SHORT }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Tag and push backend image
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/logbeacon/backend:${{ env.SHA_SHORT }}"
          docker tag logbeacon/backend:${{ env.SHA_SHORT }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
