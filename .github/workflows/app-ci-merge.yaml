name: App main release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build, scan, tag, and push images
    runs-on: ubuntu-latest
    environment: app-release-production
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -t logbeacon-${{ matrix.service }}:${{ steps.version.outputs.tag }} \
            ./${{ matrix.service }}

      - name: Trivy image scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon-${{ matrix.service }}:${{ steps.version.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: "${{ vars.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-app-ci-role"

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # --- Frontend ---
      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t logbeacon/frontend:${{ env.SHA_SHORT }} \
            frontend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon/frontend:${{ env.SHA_SHORT }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Tag and push frontend image
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/logbeacon/frontend:${{ env.SHA_SHORT }}"
          docker tag logbeacon/frontend:${{ env.SHA_SHORT }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          docker tag logbeacon/frontend:${{ env.SHA_SHORT }} "${{ steps.ecr-login.outputs.registry }}/logbeacon/frontend:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/logbeacon/frontend:latest"

      # --- Backend ---
      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t logbeacon/backend:${{ env.SHA_SHORT }} \
            backend

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon/backend:${{ env.SHA_SHORT }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Tag and push backend image
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/logbeacon/backend:${{ env.SHA_SHORT }}"
          docker tag logbeacon/backend:${{ env.SHA_SHORT }} "$IMAGE_URI"
          docker push "$IMAGE_URI"
          docker tag logbeacon/backend:${{ env.SHA_SHORT }} "${{ steps.ecr-login.outputs.registry }}/logbeacon/backend:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/logbeacon/backend:latest"
