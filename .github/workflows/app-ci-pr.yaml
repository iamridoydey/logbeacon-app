# Action revisions are pinned in CI_SETUP.md if needed, but here we use latest stable versions.
name: App ci on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@7
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in fs mode on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "logbeacon-app/frontend"
          format: "sarif"
          output: "trivy-frontend-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true 

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() 
        with:
          sarif_file: "trivy-frontend-results.sarif"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend test
        run: npm test

      - name: Frontend lint
        run: npm run lint


  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@7
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in fs mode on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "logbeacon-app/backend"
          format: "sarif"
          output: "trivy-backend-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true 

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() 
        with:
          sarif_file: "trivy-backend-results.sarif"

      - name: Setup Python
        uses: actions/setup-python@v7 
        with:
          python-version: 'pypy3.12' 

      - name: Install dependencies
        run: pip install -r requirements.txt 

      - name: Backend test
        run: npm test

      - name: Backend lint
        run: npm run lint
