name: App common ci on pull request
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  checkov-and-trivy-fs:
    name: Checkov and Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Checkov (Dockerfile + docker-compose)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,docker_compose
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install and test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --watchAll=false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend install and pytest
        working-directory: backend
        run: |
          pip install -r requirements.txt --break-system-packages
          pip install pytest flake8 --break-system-packages
          flake8 .
          pytest

  # Trust policy must allow pull_request on this repo or OIDC fails.
  # Role must be allowed secretsmanager:GetSecretValue on sonarqube-ci-cred*.
  sonarqube-analysis:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs:
      - test-and-lint
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: "${{ vars.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-app-pr-role"

      - name: Read SonarQube credentials from Secrets Manager
        id: sonar
        run: |
          set -euo pipefail
          secret=$(aws secretsmanager get-secret-value \
            --secret-id sonarqube-ci-cred \
            --query SecretString \
            --output text)
          # Expected JSON: {"host_url":"https://...","token":"..."}
          echo "host_url=$(printf '%s' "$secret" | jq -r '.host_url // .url // .SONAR_HOST_URL')" >> "$GITHUB_OUTPUT"
          echo "token=$(printf '%s' "$secret" | jq -r '.token // .SONAR_TOKEN')" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: ${{ steps.sonar.outputs.host_url }}
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ steps.sonar.outputs.host_url }}
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}

  build-and-scan-images:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs:
      - checkov-and-trivy-fs
      - test-and-lint
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.service }} image
        run: |
          docker build -t logbeacon-${{ matrix.service }}:pr-${{ github.event.pull_request.number }} ./${{ matrix.service }}

      - name: Trivy image scan — ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: logbeacon-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-${{ matrix.service }}-image.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: trivy-${{ matrix.service }}-image.sarif
          category: trivy-image-${{ matrix.service }}

  common-ci-passed:
    name: Common CI passed
    runs-on: ubuntu-latest
    needs:
      - checkov-and-trivy-fs
      - test-and-lint
      - sonarqube-analysis
      - build-and-scan-images
    steps:
      - run: echo "Common CI passed — ready for review and merge."