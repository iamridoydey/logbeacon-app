# Action revisions are pinned in CI_SETUP.md if needed, but here we use latest stable versions.
name: App ci on pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in fs mode on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          format: "sarif"
          output: "trivy-frontend-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-frontend-results.sarif"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend test
        working-directory: frontend
        run: npm test

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Checkov Frontend Dockerfile Scan
        id: checkov-frontend
        uses: bridgecrewio/checkov-action@master
        with:
          directory: frontend
          output_format: sarif
          output_file_path: checkov-frontend-results.sarif
          framework: dockerfile
          # soft_fail allows the workflow to continue so results always upload
          soft_fail: true

      - name: Upload frontend Checkov results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-frontend-results.sarif

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner in fs mode on frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "backend"
          format: "sarif"
          output: "trivy-backend-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend-results.sarif"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "pypy-3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Backend test
        working-directory: backend
        env:
          GROQ_API_KEY: test-groq-api-key
          GROQ_MODEL: test-groq-model
          ALLOWED_ORIGINS: test-allowed-origins
          DATABASE_URL: test-database-url
          SQLALCHEMY_TRACK_MODIFICATIONS: "default=False"
          REDIS_URL: test-redis-url
          SECRET_KEY: test-secret-key
          CHAT_RETENTION_DAYS: test-chat-retention-days
          MAX_ERROR_LENGTH: test-max-error-length
          PRICE_PER_MILLION_TOKENS: test-price-per-million-tokens
          SMTP_HOST: test-smtp-host
          SMTP_PORT: test-smtp-port
          SMTP_USER: test-smtp-user
          SMTP_PASSWORD: test-smtp-password
          FROM_EMAIL: test-from-email

        run: pytest

      - name: Backend lint
        working-directory: backend
        run: ruff check .

      - name: Checkov Backend Dockerfile Scan
        id: checkov-backend
        uses: bridgecrewio/checkov-action@master
        with:
          directory: backend
          output_format: sarif
          output_file_path: checkov-backend-results.sarif
          framework: dockerfile
          # soft_fail allows the workflow to continue so results always upload
          soft_fail: true

      - name: Upload backend Checkov results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-backend-results.sarif

  aws-auth-build-scan-images:
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
      - backend-checks
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set SHA_SHORT
        run: echo "SHA_SHORT=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_ENV

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-app-ci-role

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t logbeacon-frontend:${{ env.SHA_SHORT }} \
            frontend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon-frontend:${{ env.SHA_SHORT }}
          format: table
          output: trivy-frontend.txt
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload frontend scan result
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-scan
          path: trivy-frontend.txt

      - name: Build backend image
        run: |
          docker build \
            --platform linux/amd64 \
            -t logbeacon-backend:${{ env.SHA_SHORT }} \
            backend

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: logbeacon-backend:${{ env.SHA_SHORT }}
          format: table
          output: trivy-backend.txt
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Upload backend scan result
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-scan
          path: trivy-backend.txt
