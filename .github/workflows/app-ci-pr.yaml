# Action revisions are pinned in CI_SETUP.md if needed, but here we use latest stable versions.
name: App common CI on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Frontend lint, tests, and CSS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend JavaScript
        working-directory: frontend
        run: npm run lint
      - name: Test frontend with coverage
        working-directory: frontend
        run: npm run test:ci
      - name: Normalize JavaScript coverage paths for SonarQube
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      - name: Build production CSS
        working-directory: frontend
        run: npm run build:css
      - name: Save frontend-coverage
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Backend lint and tests
    env:
      DATABASE_URL: postgresql://logbeacon:logbeacon@localhost:5432/logbeacon_dev_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-backend-secret
      GROQ_API_KEY: ci-test-placeholder
      GROQ_MODEL: ci-test-model
      ALLOWED_ORIGINS: http://localhost:3000
      SMTP_PORT: "587"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: logbeacon
          POSTGRES_PASSWORD: logbeacon
          POSTGRES_DB: logbeacon_dev_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U logbeacon -d logbeacon_dev_test" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-ci.txt
      - name: Lint backend Python
        working-directory: backend
        run: python -m flake8 . --count --statistics
      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          mkdir -p reports
          python -m pytest tests -q --strict-markers --junitxml=reports/pytest.xml --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Normalize Python coverage paths for SonarQube
        run: python -c "import xml.etree.ElementTree as E; p='backend/coverage.xml'; t=E.parse(p); [setattr(s, 'text', 'backend/app') for s in t.findall('./sources/source')]; t.write(p, encoding='utf-8', xml_declaration=True)"
      - name: Save backend-reports
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/reports/pytest.xml
          if-no-files-found: error
          retention-days: 7

  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Checkov Dockerfile scan
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkov Dockerfile scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false
      - name: Upload checkov-dockerfile to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && !cancelled() }}
        with:
          sarif_file: checkov-results.sarif
          category: checkov-dockerfile
      - name: Save checkov-report
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: checkov-report
          path: checkov-results.sarif
          if-no-files-found: error
          retention-days: 7

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Trivy filesystem scan
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan dependencies, secrets, and supported configuration files
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: false
          timeout: 10m
          skip-dirs: .git
      - name: Upload trivy-filesystem to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && !cancelled() }}
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem
      - name: Save trivy-fs-report
        uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: trivy-fs-report
          path: trivy-fs-results.sarif
          if-no-files-found: error
          retention-days: 7
