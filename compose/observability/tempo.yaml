target: all

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    # Write ahead log
    # Before flushing to obj storage it will written to
    # this wall for safety net
    wal:
      path: /var/tempo/wal
    # Real object storage destination
    local:
      path: /var/tempo/blocks