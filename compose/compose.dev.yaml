include:
  - compose.app.yaml
  - compose.observ.yaml

services:
  frontend:
    build:
      context: ../frontend
      target: builder
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ../backend
      target: builder
    command: sh -c "alembic upgrade head && gunicorn -c gunicorn.conf.py wsgi:app"
    volumes:
      - ../backend:/app
      - /app/.venv

networks:
  logbeacon:
    driver: bridge
    name: logbeacon