# Project
sonar.projectKey=logbeacon-app
sonar.projectName=Logbeacon App
sonar.projectVersion=1.0

# Source directories
sonar.sources=frontend,backend

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/migrations/**

# JavaScript(Express)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Python (Flask)
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml

# Test locations
sonar.tests=frontend/tests,backend/tests

# Test file patterns
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/test_*.py,**/*_test.py

# Ignore coverage for generated files
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.spec.js,**/test_*.py,**/*_test.py

# SCM
sonar.scm.provider=git